$kind: http-request
description: |-
  Lists every enum. Postman and other clients use introspection for autocomplete.
url: "{{base_url}}/graphql"
method: POST
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "query": "{ __schema { types { name kind enumValues { name } } } }",
      "variables": {}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("no GraphQL errors", () => pm.expect(pm.response.json().errors).to.be.undefined);
      const enums = pm.response.json().data.__schema.types.filter((t) => t.kind === "ENUM").map((t) => t.name);
      pm.test("domain enums exposed", () => pm.expect(enums).to.include.members(["Country", "Currency", "PaymentStatusCode", "TransferRoute", "BacEnvironment"]));
