$kind: http-request
description: |-
  First poll: IN_PROGRESS.
url: "{{base_url}}/graphql"
method: POST
order: 9000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "query": "query($c: BacConnectionInput, $id: ID!) { bac(connection: $c) { paymentStatus(country: HN, messageId: $id) { messageId state statusCode countsByStatus { status count controlSum } paymentInfos { transactions { endToEndId state statusInfo } } } } }",
      "variables": {
        "c": {
          "environment": "{{bac_environment}}",
          "clientId": "{{bac_client_id}}",
          "clientSecret": "{{bac_client_secret}}",
          "clientBic": "{{bac_client_bic}}",
          "ownerBic": "{{bac_owner_bic}}"
        },
        "id": "{{message_id}}"
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("no GraphQL errors", () => pm.expect(pm.response.json().errors).to.be.undefined);
      pm.test("in progress", () => pm.expect(pm.response.json().data.bac.paymentStatus.state).to.eql("IN_PROGRESS"));
